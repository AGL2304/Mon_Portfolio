[project]
name = "portfolio-backend"
version = "2.0.0"
description = "Portfolio backend — FastAPI + SQLAlchemy + JWT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", ".venv", "tests/test_portfolio.db"]

[tool.ruff.lint]
# E,W = pycodestyle · F = pyflakes · I = isort · B = bugbear
# UP = pyupgrade · S = bandit (security) · N = pep8-naming
select = ["E", "W", "F", "I", "B", "UP", "S", "N"]
ignore = [
    "E501",  # line length (geree par formatter)
    "S101",  # assert (utilise dans les tests)
    # B008 : FastAPI utilise `Depends()` / `File()` en arguments par defaut
    # comme pattern d'injection. Ce n'est pas un bug — c'est le bon usage.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests : mots de passe et tokens en dur acceptables
"tests/**/*.py" = ["S105", "S106", "S311"]
# config.py : les valeurs par defaut sont des placeholders EXPLICITES
# qui indiquent a l'utilisateur de les changer en production.
"app/config.py" = ["S105"]
# schemas.py : "bearer" est le type de token OAuth2 standard, pas un mot de passe.
"app/schemas.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
