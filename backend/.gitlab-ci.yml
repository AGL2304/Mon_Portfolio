backend:test:
  stage: test
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "pip-backend"
    paths:
      - .cache/pip
  before_script:
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
  script:
    - pytest backend/tests -q
  rules:
    - changes:
        - backend/**/*

backend:build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t portfolio-backend ./backend
  rules:
    - changes:
        - backend/**/*
