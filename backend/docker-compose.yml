# ============================================================
#  Portfolio Backend — standalone deployment
# ============================================================
#  Lance UNIQUEMENT le backend FastAPI. La DB doit etre accessible
#  via DATABASE_URL (Postgres deja deploye ailleurs : ../db/, un
#  service manage type Supabase/Neon, ou docker compose externe).
#
#  Usage :
#    cp .env.example .env
#    docker compose up --build
#
#  API : http://localhost:8000/api
# ============================================================
services:
  backend:
    build:
      context: .
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_BASE_URL: ${APP_BASE_URL:-}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}'
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
