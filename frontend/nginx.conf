# ============================================================
#  Portfolio Frontend — nginx config
# ============================================================
#  Sert :
#    - React SPA (dist/) sur /
#    - Proxy /api/* et /grc/* vers le backend (BACKEND_HOST:BACKEND_PORT)
#
#  Le frontend ne contient PLUS de /grc/ ni de /assets/ statiques :
#  ces ressources sont propriete du backend (et y restent en cas de
#  split en repos separes).
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de securite basiques
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml;

    # --- Proxy vers le backend : API REST ---
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Proxy vers le backend : livrables GRC (fichiers Markdown/CSV) ---
    location /grc/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/grc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- React SPA fallback (toutes les autres routes) ---
    # Sert /favicon.svg, /screenshots/*, /assets/*.js, etc. depuis dist/,
    # et retombe sur index.html pour les routes React (/admin/login, etc.)
    location / {
        try_files $uri /index.html;
    }
}
