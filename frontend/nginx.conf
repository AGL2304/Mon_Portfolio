server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de securite basiques (coherent avec un portfolio "GRC").
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression pour les assets text/HTML/CSS/JS/SVG/JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml;

    # --- Livrables GRC publics ---
    # Listing autorise pour que les visiteurs puissent parcourir les fichiers.
    location /grc/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        # Forcer le mime correct pour les .md et .csv (lus dans le navigateur)
        types { text/markdown md; text/csv csv; }
        default_type text/plain;
        try_files $uri $uri/ =404;
    }

    # --- Assets statiques (CV, photo, screenshots, favicon) ---
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # --- API backend (FastAPI via service "backend") ---
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- React SPA fallback (toutes les autres routes : /, /admin/login, etc.) ---
    location / {
        try_files $uri /index.html;
    }
}
