# ============================================================
#  Portfolio Frontend — standalone deployment
# ============================================================
#  Lance UNIQUEMENT le frontend (React + nginx). Le backend doit
#  etre accessible : par defaut via host.docker.internal:8000
#  (backend tourne sur l'hote), ou pointer ailleurs avec BACKEND_HOST.
#
#  Usage :
#    cp .env.example .env
#    docker compose up --build
#
#  Site : http://localhost:3000
# ============================================================
services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: portfolio-frontend
    restart: unless-stopped
    environment:
      # Le nginx interne fait envsubst pour resoudre ces 2 variables
      # dans nginx.conf au boot.
      BACKEND_HOST: ${BACKEND_HOST:-host.docker.internal}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    extra_hosts:
      # Permet d'utiliser host.docker.internal sur Linux aussi
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
