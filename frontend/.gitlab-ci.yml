frontend:lint:
  stage: test
  image: node:20
  cache:
    key: "npm-frontend"
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run lint
  rules:
    - changes:
        - frontend/**/*

frontend:test:
  stage: test
  image: node:20
  cache:
    key: "npm-frontend"
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run test
  rules:
    - changes:
        - frontend/**/*

frontend:build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t portfolio-frontend ./frontend
  rules:
    - changes:
        - frontend/**/*
