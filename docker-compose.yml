services:
  db:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-charbelazon23@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-charbelazon23@gmail.com}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://portfolio:portfolio@db:5432/portfolio}
      APP_BASE_URL: ${APP_BASE_URL:-}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000","http://localhost:4173"]}'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: portfolio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
