# ============================================================
#  Portfolio — orchestrateur (db + backend + frontend)
# ============================================================
#  Lance les 3 services ensemble. Pour deployer un service seul,
#  voir ./db/docker-compose.yml, ./backend/docker-compose.yml,
#  ./frontend/docker-compose.yml.
#
#  Usage :
#    cp .env.example .env
#    docker compose up --build
#
#  Services :
#    db       PostgreSQL 16          :5432
#    backend  FastAPI                :8000 (interne)
#    frontend React + nginx          :3000 -> nginx proxie /api/ et /grc/
# ============================================================
services:
  db:
    build:
      context: ./db
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - portfolio_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_BASE_URL: ${APP_BASE_URL:-}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: portfolio-frontend
    restart: unless-stopped
    environment:
      # nginx interne resoudra http://backend:8000/ via DNS docker-compose
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  portfolio_data:
    name: portfolio_db_data
