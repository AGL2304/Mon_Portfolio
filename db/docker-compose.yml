# ============================================================
#  Portfolio DB — standalone deployment
# ============================================================
#  Lance UNIQUEMENT la base de donnees. Utile pour :
#   - dev frontend/backend sur l'hote (DB dans Docker)
#   - tester l'image db/ isolement
#   - deployer la DB sur un host dedie
#
#  Usage :
#    cp .env.example .env
#    docker compose up --build
#
#  Connexion :
#    psql -h localhost -p 5432 -U portfolio -d portfolio
# ============================================================
services:
  db:
    build:
      context: .
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - portfolio_data:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  portfolio_data:
    name: portfolio_db_data
