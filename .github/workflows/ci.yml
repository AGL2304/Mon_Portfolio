name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ============================================================
#  Path filters : chaque job ne tourne que si ses fichiers changent.
#  Permet de split en 3 repos plus tard sans changer la logique.
#  Le workflow lui-meme (ce fichier) declenche TOUS les jobs.
# ============================================================

# Force Node.js 24 pour TOUTES les actions JavaScript du workflow.
# Eteint les warnings de deprecation Node 20 (cf GitHub Actions
# deprecation Sep 2026). A retirer quand toutes les actions
# (dorny/paths-filter, docker/build-push-action) auront migre.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ------------------------------------------------------------
  #  DB : verifier que l'image Postgres+init build correctement
  # ------------------------------------------------------------
  db-build:
    name: DB · build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect db changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            db:
              - 'db/**'
              - '.github/workflows/ci.yml'

      - name: Set up Docker Buildx
        if: steps.changes.outputs.db == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build db image
        if: steps.changes.outputs.db == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: false
          tags: portfolio-db:ci

  # ------------------------------------------------------------
  #  BACKEND : ruff + pytest + Docker build
  # ------------------------------------------------------------
  backend-tests:
    name: Backend · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      - name: Set up Python 3.12
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.changes.outputs.backend == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        if: steps.changes.outputs.backend == 'true'
        run: ruff check .

      - name: Ruff format check
        if: steps.changes.outputs.backend == 'true'
        run: ruff format --check .

      - name: Run tests
        if: steps.changes.outputs.backend == 'true'
        run: pytest -q

  backend-docker:
    name: Backend · build image
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: portfolio-backend:ci

  # ------------------------------------------------------------
  #  FRONTEND : eslint + prettier + vitest + build + E2E + Docker
  # ------------------------------------------------------------
  frontend-tests:
    name: Frontend · eslint + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test --if-present

      - name: Build
        run: npm run build

  e2e:
    name: Frontend · Playwright E2E
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run e2e

  frontend-docker:
    name: Frontend · build image
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: portfolio-frontend:ci
          build-args: |
            VITE_API_URL=/api
