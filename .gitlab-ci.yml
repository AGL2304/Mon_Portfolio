stages:
  - test
  - build

backend_tests:
  stage: test
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "pip-cache"
    paths:
      - .cache/pip
  before_script:
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
  script:
    - pytest backend/tests -q

frontend_tests:
  stage: test
  image: node:20
  cache:
    key: "npm-cache"
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run test

build_images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t portfolio-backend ./backend
    - docker build -t portfolio-frontend ./frontend

